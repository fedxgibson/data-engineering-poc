version: 2

models:
  - name: stg_vessel_position
    columns:
      - name: mmsi
        tests: [not_null]
      - name: ts_utc
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [mmsi, ts_utc]

  - name: stg_vessel_static
    columns:
      - name: mmsi
        tests: [not_null, unique]

  - name: port_events
    columns:
      - name: mmsi
        tests: [not_null]
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: [enter, exit]
